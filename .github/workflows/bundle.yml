name: bundle

on: [push, pull_request]

permissions: {}

jobs:
  # `dist/` is what GitHub runs -- there's no build step at run time -- so a
  # bundle that lags behind `src/` ships the wrong code.
  check:
    permissions:
      contents: read  # for actions/checkout to fetch code
    name: dist is current
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code --stat dist/; then
            echo "::error::dist/ is out of date; run 'npm run build' and commit the result."
            exit 1
          fi
